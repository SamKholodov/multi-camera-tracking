# Association ablation: mixed soft geometry/temporal penalties.
# Run: python run.py --config config/assoc_ablation/soft_geometry.yaml

run_mode: multi_camera

detector:
  model: models/yolov8m.pt
  target_classes: [2, 3, 5, 7]
  conf_thres: 0.2
  imgsz: 960
  device: 0

tracker:
  type: deepocsort
  use_embeddings: true
  reid_weights: models/osnet_ibn_x1_0_msmt17.pt
  device: 0
  half: false
  det_thresh: 0.4
  max_age: 30
  min_hits: 5
  iou_threshold: 0.3
  appearance_update: ema
  reid_accum_conf_thresh: 0.6

multi_camera:
  cam_ids: [6, 7, 8, 9]
  sources:
    - datasets/validation/S02/c006/vdo.avi
    - datasets/validation/S02/c007/vdo_synch.avi
    - datasets/validation/S02/c008/vdo_synch.avi
    - datasets/validation/S02/c009/vdo_synch.avi
  homos:
    - datasets/validation/S02/c006/calibration.txt
    - datasets/validation/S02/c007/calibration.txt
    - datasets/validation/S02/c008/calibration.txt
    - datasets/validation/S02/c009/calibration.txt
  roi: auto
  association:
    gate_mode: mixed
    gates:
      different_cam: true
      temporal: true
      geometry_overlap: true
      cam_transition: false
    reid_matching: true
    geometry_max_distance_m: 9.0
    geometry_far_penalty: 5.0
    geometry_missing_penalty: 5.0
    temporal_far_penalty: 5.0
    temporal_missing_penalty: 5.0
    max_cross_cam_gap_frames: 300
    reid_cost_threshold: 0.25
  max_history_gap_frames: 300
  results_dir: outputs/assoc_ablation/soft_geometry

output:
  video_fps: 10
  visualize: false
  save_video: false
  save_video_dir: outputs/assoc_ablation/soft_geometry/videos
  output_path: outputs/assoc_ablation/soft_geometry/multicam.mp4
