run_mode: multi_camera

detector:
  model: models/yolo26l.pt
  target_classes:
    - 0
  conf_thres: 0.3
  device: null

tracker:
  reid_weights: models/osnet_ibn_x1_0_msmt17.pt
  device: 0
  half: false
  use_default_reid: true
  custom_reid_extractor: null

single_camera:
  source: ""
  cam_id: 0
  homo: null
  max_history_gap_frames: 30

multi_camera:
  sources: []
  homos: null
  association_cost_threshold: 0.35
  use_temporal_decay: false
  max_cross_cam_gap_frames: 300
  max_history_gap_frames: 30

output:
  visualize: true
  save_video: false
  output_path: outputs/multicam_output.mp4
  save_tracks_json: true
