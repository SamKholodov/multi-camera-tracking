# Geometry ablation — vehicle view ReID + YOLOv8m, geometry_max_distance = 3 m.
# Baseline MCMT params from vehicle_osnet_view_finetune; only geo gate changes.
# Run: python run.py --config config/geo_ablation/vehicle_view_geo_3.yaml

run_mode: multi_camera

detector:
  model: models/yolo26l.pt
  target_classes: [2, 3, 5, 7]
  conf_thres: 0.4
  device: 0

tracker:
  type: deepocsort
  use_embeddings: true
  reid_weights: runs/vehicle_reid/osnet_x1_0_veri_vric_with_01_view/best.pth
  reid_preprocess: pad_ratio_resize
  device: 0
  half: false
  det_thresh: 0.6
  max_age: 30
  min_hits: 5
  iou_threshold: 0.3

multi_camera:
  cam_ids: [6, 7, 8, 9]
  sources:
    - datasets/validation/S02/c006/vdo.avi
    - datasets/validation/S02/c007/vdo_synch.avi
    - datasets/validation/S02/c008/vdo_synch.avi
    - datasets/validation/S02/c009/vdo_synch.avi
  homos:
    - datasets/validation/S02/c006/calibration.txt
    - datasets/validation/S02/c007/calibration.txt
    - datasets/validation/S02/c008/calibration.txt
    - datasets/validation/S02/c009/calibration.txt
  roi: auto
  association_cost_threshold: 0.18
  association_reid_weight: 0.75
  geometry_max_distance: 3.0
  max_cross_cam_gap_frames: 300
  max_history_gap_frames: 30
  results_dir: outputs/geo_ablation/vehicle_view_geo_3

output:
  video_fps: 10
  visualize: false
  save_video: false
  output_path: outputs/geo_ablation/vehicle_view_geo_3/multicam.mp4
