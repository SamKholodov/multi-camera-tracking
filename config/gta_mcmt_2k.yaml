# Short GTA MCMT eval run: 2000 synced frames (~3.3 min @ 10 fps).
# Usage:
#   python run.py --config config/gta_mcmt_2k.yaml
#   python scripts/eval_gta_mcmt.py --pred-dir outputs/gta_mcmt_2k/per_cam --max-frame 2000

run_mode: multi_camera

detector:
  model: models/yolo26l.pt
  target_classes: [2, 3, 5, 7]
  conf_thres: 0.2
  imgsz: 640
  device: 0

tracker:
  type: deepocsort
  use_embeddings: true
  reid_weights: models/osnet_ibn_x1_0_msmt17.pt
  device: 0
  half: false
  det_thresh: 0.3
  max_age: 30
  min_hits: 3
  iou_threshold: 0.3
  appearance_update: aaf
  reid_accum_conf_thresh: 0.6

multi_camera:
  cam_ids: [0, 1, 2, 3]
  sources:
    - datasets/gta_mcmt/cam-0
    - datasets/gta_mcmt/cam-1
    - datasets/gta_mcmt/cam-2
    - datasets/gta_mcmt/cam-3
  homos: null
  roi: auto
  max_frames: 2000
  association_cost_threshold: 0.25
  association_reid_weight: 1.0
  geometry_max_distance: 0.0
  max_cross_cam_gap_frames: 300
  max_history_gap_frames: 30
  results_dir: outputs/gta_mcmt_2k

output:
  video_fps: 10
  visualize: false
  save_video: false
  save_video_dir: outputs/gta_mcmt_2k/videos
  output_path: outputs/gta_mcmt_2k/multicam.mp4
