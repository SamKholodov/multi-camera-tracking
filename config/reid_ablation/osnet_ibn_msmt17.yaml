# ReID ablation — baseline: YOLOv8m + DeepOcSort + OSNet-IBN (MSMT17 pretrained).
# Run: python run.py --config config/reid_ablation/osnet_ibn_msmt17.yaml

run_mode: multi_camera

detector:
  model: models/yolo26l.pt
  target_classes: [2, 3, 5, 7]
  conf_thres: 0.6
  device: 0

tracker:
  type: deepocsort
  use_embeddings: true
  reid_weights: models/osnet_ibn_x1_0_msmt17.pt
  device: 0
  half: false
  det_thresh: 0.6
  max_age: 30
  min_hits: 5
  iou_threshold: 0.3

multi_camera:
  cam_ids: [6, 7, 8, 9]
  sources:
    - datasets/validation/S02/c006/vdo.avi
    - datasets/validation/S02/c007/vdo_synch.avi
    - datasets/validation/S02/c008/vdo_synch.avi
    - datasets/validation/S02/c009/vdo_synch.avi
  homos:
    - datasets/validation/S02/c006/calibration.txt
    - datasets/validation/S02/c007/calibration.txt
    - datasets/validation/S02/c008/calibration.txt
    - datasets/validation/S02/c009/calibration.txt
  roi: auto
  association:
    gates:
      different_cam: false
      temporal: false
      geometry_overlap: false
      cam_transition: false
    reid_matching: true
    geometry_max_distance_m: 0.0
  # Baseline MCMT: cost_thresh=0.25, reid_weight=0.5
  association_cost_threshold: 0.18
  association_reid_weight: 0.75
  geometry_max_distance: 8.0
  max_cross_cam_gap_frames: 300
  max_history_gap_frames: 30
  results_dir: outputs/reid_ablation/osnet_ibn_msmt17

output:
  video_fps: 10
  visualize: false
  save_video: false
  output_path: outputs/reid_ablation/osnet_ibn_msmt17/multicam.mp4
