# ReID ablation — VeRi+VRIC+VeRI-Wild OSNet (epoch 120), no geometry gate.
# Training: config/reid_train/vehicle_osnet_veri_wild.yaml
# Run: python run.py --config config/reid_ablation/vehicle_osnet_veri_vric_wild_epoch120.yaml

run_mode: multi_camera

detector:
  model: models/yolo26l.pt
  target_classes: [2, 3, 5, 7]
  conf_thres: 0.6
  device: 0

tracker:
  type: deepocsort
  use_embeddings: true
  reid_weights: runs/vehicle_reid/osnet_x1_0_veri_vric_wild/epoch_120.pth
  reid_preprocess: pad_ratio_resize
  device: 0
  half: false
  det_thresh: 0.6
  max_age: 30
  min_hits: 5
  iou_threshold: 0.3

multi_camera:
  cam_ids: [6, 7, 8, 9]
  sources:
    - datasets/validation/S02/c006/vdo.avi
    - datasets/validation/S02/c007/vdo_synch.avi
    - datasets/validation/S02/c008/vdo_synch.avi
    - datasets/validation/S02/c009/vdo_synch.avi
  homos:
    - datasets/validation/S02/c006/calibration.txt
    - datasets/validation/S02/c007/calibration.txt
    - datasets/validation/S02/c008/calibration.txt
    - datasets/validation/S02/c009/calibration.txt
  roi: auto
  association:
    gates:
      temporal: false
      cam_transition: false
      zone_transition: false
    reid_matching: true
    geometry_distance_metric: plane
    geometry_t_min_m: 14.0
    geometry_t_distant_m: 0.0
    geometry_mid_penalty: 0.15
    same_cam_cost_add: 0.25
    max_cross_cam_gap_frames: 300
    reid_cost_threshold: 0.5
  association_cost_threshold: 0.5
  association_reid_weight: 0.75
  max_history_gap_frames: 30
  results_dir: outputs/reid_ablation/vehicle_osnet_veri_vric_wild_epoch120

output:
  video_fps: 10
  visualize: false
  save_video: false
  output_path: outputs/reid_ablation/vehicle_osnet_veri_vric_wild_epoch120/multicam.mp4
