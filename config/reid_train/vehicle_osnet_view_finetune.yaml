model: vehicle_osnet_x1_0
img_size: [128, 256]
preprocess: pad_ratio_resize

# View labels exist only on VeRi.
datasets: [veri]
data_dir: reid_datasets

# Load ReID weights, train only the view head.
checkpoint: runs/vehicle_reid/osnet_x1_0_veri_vric_1_without_view/best.pth
freeze_backbone: true
freeze_reid_heads: true

lambda_id: 0.0
lambda_triplet: 0.0
lambda_view: 1.0
num_view_classes: 8

p: 16
k: 4
fallback_p: 8

epochs: 40
warmup_epochs: 3
lr: 1.0e-3
weight_decay: 1.0e-4
label_smooth: 0.1
margin: 0.3
val_fraction: 0.1

best_metric: veri_view_acc
eval_ranking: false

num_workers: 4
seed: 42
device: cuda:0
project: runs/vehicle_reid
name: osnet_view_finetune
log_file: osnet_training.log
