# Baseline MCMT on AICity / CityFlow S02 (4 overlapping cameras).
#
# Notes on data:
#   - c006: reference camera — vdo.avi
#   - c007 / c008 / c009: vdo_synch.avi inside each camera folder
#     (not synch_videos/*.mp4)
#   - GT: datasets/validation/S02/c00X/gt/gt.txt (MOT16)
#
# Outputs are written to multi_camera.results_dir:
#   track_results.txt           # AICity Track-1 (cam obj_id frame x y w h xworld yworld)
#   per_cam/c006.txt ...        # MOT16 per camera with GLOBAL ids (for ID-aware metrics)
#   per_cam_local/c006.txt ...  # MOT16 per camera with LOCAL ids  (single-cam baseline)

run_mode: multi_camera

detector:
  model: models/yolo26l.pt
  # COCO: 2=car, 3=motorbike, 5=bus, 7=truck. CityFlow tracks vehicles only.
  target_classes: [2, 3, 5, 7]
  conf_thres: 0.2
  imgsz: 640
  device: 0

tracker:
  type: deepocsort
  use_embeddings: true
  reid_weights: models/osnet_ibn_x1_0_msmt17.pt
  device: 0
  half: false
  det_thresh: 0.3
  max_age: 30
  min_hits: 5
  iou_threshold: 0.3
  appearance_update: aaf
  reid_accum_conf_thresh: 0.6

multi_camera:
  cam_ids: [6, 7, 8, 9]
  sources:
    - datasets/validation/S02/c006/vdo.avi
    - datasets/validation/S02/c007/vdo_synch.avi
    - datasets/validation/S02/c008/vdo_synch.avi
    - datasets/validation/S02/c009/vdo_synch.avi
  homos:
    - datasets/validation/S02/c006/calibration.txt
    - datasets/validation/S02/c007/calibration.txt
    - datasets/validation/S02/c008/calibration.txt
    - datasets/validation/S02/c009/calibration.txt
  # ROI: "auto" loads <video_dir>/roi.jpg (CityFlow bottom-center rule)
  roi: auto
  association_cost_threshold: 0.25
  association_reid_weight: 0.5
  geometry_max_distance: 8.0
  max_cross_cam_gap_frames: 300
  max_history_gap_frames: 30
  results_dir: outputs/s02_baseline

output:
  video_fps: 10
  visualize: false
  save_video: false
  save_video_dir: outputs/s02_baseline/videos
  output_path: outputs/s02_baseline/multicam.mp4
