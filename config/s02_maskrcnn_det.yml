# MCMT on S02 using CityFlow Mask R-CNN detections (det/det_mask_rcnn.txt)
# instead of on-the-fly YOLO. Video is still read for ReID embeddings in DeepOCSORT.
#
# Detection format (datasets/ReadMe.txt):
#   frame, -1, left, top, width, height, conf, -1, -1, -1

run_mode: multi_camera

detector:
  source: cityflow_det
  det_basename: det_mask_rcnn.txt
  conf_thres: 0.5

tracker:
  type: deepocsort
  use_embeddings: true
  det_thresh: 0.5
  max_age: 30
  min_hits: 3
  iou_threshold: 0.3

multi_camera:
  cam_ids: [6, 7, 8, 9]
  sources:
    - datasets/validation/S02/c006/vdo.avi
    - datasets/validation/S02/c007/vdo_synch.avi
    - datasets/validation/S02/c008/vdo_synch.avi
    - datasets/validation/S02/c009/vdo_synch.avi
  homos:
    - datasets/validation/S02/c006/calibration.txt
    - datasets/validation/S02/c007/calibration.txt
    - datasets/validation/S02/c008/calibration.txt
    - datasets/validation/S02/c009/calibration.txt
  roi: auto
  association_cost_threshold: 0.25
  max_cross_cam_gap_frames: 300
  max_history_gap_frames: 30
  results_dir: outputs/s02_maskrcnn_det

output:
  visualize: false
  save_video: false
  output_path: outputs/s02_maskrcnn_det/multicam.mp4
