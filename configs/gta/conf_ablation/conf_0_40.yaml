# GTA conf_thres ablation: detector.conf_thres=0.4 (det_thresh and reid_accum_conf_thresh aligned).
# Run: python run.py --config configs_gta/conf_ablation/conf_0_40.yaml

run_mode: multi_camera
detector:
  model: models/yolo26l.pt
  target_classes:
  - 2
  - 3
  - 5
  - 7
  conf_thres: 0.4
  imgsz: 640
  device: 0
tracker:
  type: deepocsort
  use_embeddings: true
  reid_weights: models/osnet_ibn_x1_0_msmt17.pt
  device: 0
  half: false
  det_thresh: 0.4
  max_age: 30
  min_hits: 3
  iou_threshold: 0.3
  appearance_update: aaf
  reid_accum_conf_thresh: 0.4
multi_camera:
  cam_ids:
  - 0
  - 1
  - 2
  - 3
  sources:
  - datasets/gta_mcmt/cam-0
  - datasets/gta_mcmt/cam-1
  - datasets/gta_mcmt/cam-2
  - datasets/gta_mcmt/cam-3
  homos: null
  roi: auto
  max_frames: 2000
  association:
    gates:
      temporal: false
      cam_transition: false
      zone_transition: false
    reid_matching: true
    geometry_distance_metric: plane
    geometry_t_min_m: 14.0
    geometry_t_distant_m: 0.0
    geometry_mid_penalty: 0.15
    same_cam_cost_add: 0.25
    max_cross_cam_gap_frames: 300
    reid_cost_threshold: 0.25
  max_history_gap_frames: 30
  results_dir: outputs/configs_gta/conf_ablation/conf_0_40
output:
  video_fps: 10
  visualize: false
  save_video: false
  output_path: outputs/configs_gta/conf_ablation/conf_0_40/multicam.mp4
