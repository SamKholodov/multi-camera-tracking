run_mode: multi_camera
world_anchor: bottom_center
detector:
  model: models/yolo26l_fine_tune_gta.pt
  target_classes:
  - 2
  - 3
  - 5
  - 7
  conf_thres: 0.2
  imgsz: 960
  device: 0
tracker:
  type: deepocsort
  use_embeddings: true
  reid_weights: runs/vehicle_reid/osnet_x1_0_veri_vric_wild/epoch_120.pth
  reid_preprocess: pad_ratio_resize
  device: 0
  half: false
  det_thresh: 0.3
  max_age: 30
  min_hits: 5
  iou_threshold: 0.3
  appearance_update: ema
  reid_accum_conf_thresh: 0.5
multi_camera:
  cam_ids:
  - 0
  - 1
  - 2
  - 3
  sources:
  - datasets/gta_mcmt/cam-0
  - datasets/gta_mcmt/cam-1
  - datasets/gta_mcmt/cam-2
  - datasets/gta_mcmt/cam-3
  homos:
  - datasets/gta_mcmt/cam-0/calibration.txt
  - datasets/gta_mcmt/cam-1/calibration.txt
  - datasets/gta_mcmt/cam-2/calibration.txt
  - datasets/gta_mcmt/cam-3/calibration.txt
  roi: auto
  max_frames: null
  association:
    gates:
      temporal: false
      cam_transition: false
      zone_transition: false
    reid_matching: true
    geometry_distance_metric: plane
    geometry_t_min_m: 14.0
    geometry_t_distant_m: 55.0
    geometry_mid_penalty: 0.15
    same_cam_cost_add: 0.25
    same_frame_linking: false
    reid_strong_reject_threshold: 0.5
    max_cross_cam_gap_frames: 300
    reid_cost_threshold: 0.7
    video_fps: 30.0
    temporal_mode: 'off'
    speed_limit_enabled: false
    trajectory_enabled: false
    global_delete_after_frames: 600
  association_cost_threshold: 0.7
  max_history_gap_frames: 300
  video_fps: 30.0
  results_dir: outputs/configs_gta/geo_ablation/geo_loose
output:
  video_fps: 30.0
  visualize: false
  save_video: false
  save_video_dir: outputs/configs_gta/geo_ablation/geo_loose/videos
  output_path: outputs/configs_gta/geo_ablation/geo_loose/multicam.mp4
