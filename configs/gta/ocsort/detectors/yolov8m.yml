# GTA MCMT ablation (generated from S02 template)
run_mode: multi_camera
detector:
  model: models/yolov8m.pt
  target_classes:
  - 2
  - 3
  - 5
  - 7
  conf_thres: 0.6
  device: 0
tracker:
  type: deepocsort
  use_embeddings: false
  det_thresh: 0.6
  max_age: 30
  min_hits: 5
  iou_threshold: 0.3
multi_camera:
  cam_ids:
  - 0
  - 1
  - 2
  - 3
  sources:
  - datasets/gta_mcmt/cam-0
  - datasets/gta_mcmt/cam-1
  - datasets/gta_mcmt/cam-2
  - datasets/gta_mcmt/cam-3
  homos: null
  roi: auto
  association_cost_threshold: 0.25
  association_reid_weight: 0.5
  geometry_max_distance: 0.0
  max_cross_cam_gap_frames: 300
  max_history_gap_frames: 30
  results_dir: outputs/configs_gta/s02_baseline/ocsort/detectors/yolov8m
output:
  video_fps: 10
  visualize: false
  save_video: false
  output_path: outputs/configs_gta/s02_baseline/ocsort/detectors/yolov8m/multicam.mp4
