# GTA MCMT ablation (generated from S02 template)

run_mode: multi_camera
detector:
  model: models/yolo26l_fine_tune_gta.pt
  target_classes:
  - 2
  - 3
  - 5
  - 7
  conf_thres: 0.2
  imgsz: 960
  device: 0
tracker:
  type: deepocsort
  use_embeddings: true
  reid_weights: models/osnet_ibn_x1_0_msmt17.pt
  device: 0
  half: false
  det_thresh: 0.3
  max_age: 30
  min_hits: 5
  iou_threshold: 0.3
  appearance_update: ema
  reid_accum_conf_thresh: 0.5
multi_camera:
  cam_ids:
  - 0
  - 1
  - 2
  - 3
  sources:
  - datasets/gta_mcmt/cam-0
  - datasets/gta_mcmt/cam-1
  - datasets/gta_mcmt/cam-2
  - datasets/gta_mcmt/cam-3
  homos: null
  roi: auto
  association:
    gates:
      different_cam: false
      temporal: false
      geometry_overlap: false
      cam_transition: false
      zone_transition: true
    zones_path: configs_gta/gta_zone_tracklet.yaml
    reid_matching: true
    geometry_max_distance_m: 0.0
    max_cross_cam_gap_frames: 300
    reid_cost_threshold: 0.25
  max_history_gap_frames: 300
  results_dir: outputs/configs_gta/assoc_ablation/+zone_tracklet
output:
  video_fps: 10
  visualize: false
  save_video: false
  save_video_dir: outputs/configs_gta/assoc_ablation/+zone_tracklet/videos
  output_path: outputs/configs_gta/assoc_ablation/+zone_tracklet/multicam.mp4
