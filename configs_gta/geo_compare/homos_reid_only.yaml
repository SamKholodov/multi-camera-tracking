# GTA MCMT: homography wired, ReID association (no geometry gate).

run_mode: multi_camera
detector:
  model: models/yolo26l_fine_tune_gta.pt
  target_classes:
  - 2
  - 3
  - 5
  - 7
  conf_thres: 0.2
  imgsz: 640
  device: 0
tracker:
  type: deepocsort
  use_embeddings: true
  reid_weights: models/osnet_ibn_x1_0_msmt17.pt
  device: 0
  half: false
  det_thresh: 0.3
  max_age: 30
  min_hits: 3
  iou_threshold: 0.3
  appearance_update: aaf
  reid_accum_conf_thresh: 0.5
multi_camera:
  cam_ids:
  - 0
  - 1
  - 2
  - 3
  sources:
  - datasets/gta_mcmt/cam-0
  - datasets/gta_mcmt/cam-1
  - datasets/gta_mcmt/cam-2
  - datasets/gta_mcmt/cam-3
  homos:
  - datasets/gta_mcmt/cam-0/calibration.txt
  - datasets/gta_mcmt/cam-1/calibration.txt
  - datasets/gta_mcmt/cam-2/calibration.txt
  - datasets/gta_mcmt/cam-3/calibration.txt
  roi: auto
  max_frames: 2000
  association:
    gate_mode: mixed
    gates:
      different_cam: true
      temporal: true
      geometry_overlap: false
      cam_transition: false
    reid_matching: true
    geometry_max_distance_m: 0.0
    geometry_distance_metric: plane
    max_cross_cam_gap_frames: 300
    reid_cost_threshold: 0.25
  max_history_gap_frames: 30
  results_dir: outputs/configs_gta/geo_compare/homos_reid_only
output:
  video_fps: 10
  visualize: false
  save_video: false
  output_path: outputs/configs_gta/geo_compare/homos_reid_only/multicam.mp4
