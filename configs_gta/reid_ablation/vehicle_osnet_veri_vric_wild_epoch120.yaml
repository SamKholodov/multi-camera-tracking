# GTA MCMT ReID ablation: VeRi+VRIC+VeRI-Wild OSNet (epoch 120), no geometry gate.

run_mode: multi_camera
detector:
  model: models/yolo26l_fine_tune_gta.pt
  target_classes:
  - 2
  - 3
  - 5
  - 7
  conf_thres: 0.2
  device: 0
tracker:
  type: deepocsort
  use_embeddings: true
  reid_weights: runs/vehicle_reid/osnet_x1_0_veri_vric_wild/epoch_120.pth
  reid_preprocess: pad_ratio_resize
  device: 0
  half: false
  det_thresh: 0.3
  max_age: 30
  min_hits: 5
  iou_threshold: 0.3
  reid_accum_conf_thresh: 0.5
multi_camera:
  cam_ids:
  - 0
  - 1
  - 2
  - 3
  sources:
  - datasets/gta_mcmt/cam-0
  - datasets/gta_mcmt/cam-1
  - datasets/gta_mcmt/cam-2
  - datasets/gta_mcmt/cam-3
  homos: null
  roi: auto
  association:
    gates:
      different_cam: false
      temporal: false
      geometry_overlap: false
      cam_transition: false
    reid_matching: true
    geometry_max_distance_m: 0.0
  association_cost_threshold: 0.5
  association_reid_weight: 0.75
  geometry_max_distance: 0.0
  max_cross_cam_gap_frames: 300
  max_history_gap_frames: 30
  results_dir: outputs/configs_gta/reid_ablation/vehicle_osnet_veri_vric_wild_epoch120
output:
  video_fps: 10
  visualize: false
  save_video: false
  output_path: outputs/configs_gta/reid_ablation/vehicle_osnet_veri_vric_wild_epoch120/multicam.mp4
